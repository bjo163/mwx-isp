name: Auto-merge dev to main

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [dev]

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'dev'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch main
        run: git fetch origin main

      - name: Check whether dev has work main lacks
        id: diff
        run: |
          if git diff --quiet origin/main origin/dev; then
            echo "main already carries dev's tree"
          else
            echo "Changes detected"
            echo "diff=true" >> $GITHUB_OUTPUT
          fi

      - name: Bring main into dev
        if: steps.diff.outputs.diff == 'true'
        id: sync
        run: |
          if git merge-base --is-ancestor origin/main origin/dev; then
            echo "dev already carries main"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout -B dev origin/dev
            # main's required checks are strict, so a PR head that is behind main is
            # BEHIND and unmergeable, and GitHub will not update dev under the
            # linear-history rule. Carrying main in is the only move left to the bot;
            # the squash merge below flattens this commit out of main.
            git merge --no-edit origin/main
            git push origin dev
            echo "synced=true" >> $GITHUB_OUTPUT
          fi

      - name: Create and merge PR
        if: steps.diff.outputs.diff == 'true' && steps.sync.outputs.synced != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$(git rev-parse origin/dev)" != "$CI_SHA" ]; then
            echo "dev moved on past the CI run this job was triggered by; wait for its CI"
            exit 0
          fi

          PR_NUM=$(gh pr list --base main --head dev --state open --json number --jq '.[0].number // ""')
          if [ -z "$PR_NUM" ]; then
            PR_NUM=$(gh pr create \
              --base main \
              --head dev \
              --title "Auto-merge: dev → main (CI passed)" \
              --body "Auto-merge after CI passed on dev." | sed 's#.*/##')
          fi
          echo "Promoting PR #$PR_NUM"
          # Linear history rejects a --merge, and the sync commit above makes a --rebase
          # refuse the PR, so squash is the only method left; it still keeps main linear.
          # No --admin: the required checks are the CI job names, and they are green for
          # exactly the SHA this job promotes.
          gh pr merge "$PR_NUM" --squash
