name: Auto-merge dev to main

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [dev]

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'dev'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch main
        run: git fetch origin main

      - name: Check if dev differs from main
        id: diff
        run: |
          if git rev-parse origin/main == git rev-parse origin/dev; then
            echo "No changes"
          else
            echo "Changes detected"
            echo "diff=true" >> $GITHUB_OUTPUT
          fi

      - name: Create and merge PR
        if: steps.diff.outputs.diff == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM=$(gh pr create \
            --base main \
            --head dev \
            --title "Auto-merge: dev → main (CI passed)" \
            --body "Auto-merge after CI passed on dev.")
          echo "Created PR #$PR_NUM"
          gh pr merge "$PR_NUM" --merge --auto
