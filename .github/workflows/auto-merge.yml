name: Auto-merge dev to main

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [dev]

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'dev'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch main
        run: git fetch origin main

      - name: Check whether dev has work main lacks
        id: diff
        run: |
          if git diff --quiet origin/main origin/dev; then
            echo "main already carries dev's tree"
          else
            echo "Changes detected"
            echo "diff=true" >> $GITHUB_OUTPUT
          fi

      - name: Create and merge PR
        if: steps.diff.outputs.diff == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$(git rev-parse origin/dev)" != "$CI_SHA" ]; then
            echo "dev moved on past the CI run this job was triggered by; wait for its CI"
            exit 0
          fi

          PR_NUM=$(gh pr list --base main --head dev --state open --json number --jq '.[0].number // ""')
          if [ -z "$PR_NUM" ]; then
            PR_NUM=$(gh pr create \
              --base main \
              --head dev \
              --title "Auto-merge: dev → main (CI passed)" \
              --body "Auto-merge after CI passed on dev." | sed 's#.*/##')
          fi
          echo "Promoting PR #$PR_NUM"
          # Squash is the only method main accepts: linear history rejects a merge commit,
          # and a rebase refuses any PR that carries one - which a dev branch behind main
          # always does, because a squash promotion never marks dev's commits as merged.
          # No --admin and no "update dev with main" step: a push made with GITHUB_TOKEN
          # starts no CI run, so syncing dev here would end the workflow_run chain. That
          # is why main's required checks run with strict off - CI on the promoted dev SHA
          # is still the gate, since this job only fires for a green run on that SHA.
          gh pr merge "$PR_NUM" --squash
