name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26'
  CGO_ENABLED: 0

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests
        run: go test -v -short -coverprofile=coverage.out ./...

      - name: Run integration tests
        env:
          TEST_DATABASE_HOST: 127.0.0.1
          TEST_DATABASE_PORT: '15432'
          TEST_DATABASE_USER: mwxisp_test
          TEST_DATABASE_PASSWORD: test-only-password
          TEST_DATABASE_NAME: postgres
          TEST_LDAP_URL: ldap://127.0.0.1:1389
          TEST_LDAP_BASE_DN: dc=example,dc=org
          TEST_LDAP_USER_FILTER: (cn=%s)
          TEST_LDAP_BIND_DN_TEMPLATE: cn=%s,ou=users,dc=example,dc=org
          TEST_LDAP_ADMIN_DN: cn=admin,dc=example,dc=org
          TEST_LDAP_ADMIN_PASSWORD: adminpassword
          TEST_LDAP_USER: alice
          TEST_LDAP_PASSWORD: alice-password
          INTEGRATION_REQUIRED: '1'
        run: |
          docker run -d --name postgres -e POSTGRES_USER=mwxisp_test -e POSTGRES_PASSWORD=test-only-password -e POSTGRES_DB=postgres -p 15432:5432 postgres:16-alpine
          docker run -d --name openldap -e LDAP_ROOT=dc=example,dc=org -e LDAP_ADMIN_USERNAME=admin -e LDAP_ADMIN_PASSWORD=adminpassword -e LDAP_USERS=alice,bob -e LDAP_PASSWORDS=alice-password,bob-password -p 1389:1389 bitnamilegacy/openldap:2.6
          go test -tags=integration -count=1 -v ./test/integration/...

      - name: Run linter
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2
          args: --timeout=5m

      - name: Run security scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
        continue-on-error: true

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.out
          fail_ci_if_error: false
        continue-on-error: true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 45
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download dependencies
        run: go mod download

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          BINARY_NAME="mwx-isp"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME="mwx-isp.exe"
          fi
          
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "develop")
          BUILD_TIME=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          GIT_COMMIT=$(git rev-parse --short HEAD)
          
          go build -ldflags "-s -w \
            -X main.Version=${VERSION} \
            -X main.BuildTime=${BUILD_TIME} \
            -X main.GitCommit=${GIT_COMMIT}" \
            -o "dist/${BINARY_NAME}" main.go
          
          echo "✅ Built ${{ matrix.goos }}/${{ matrix.goarch }}"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mwx-isp-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          retention-days: 7

  docker-publish:
    name: Publish GHCR image
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 60
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/bjo163/mwx-isp
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: docker-publish
    timeout-minutes: 10
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: false

      - name: Build release binaries
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "develop")
          BUILD_TIME=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          GIT_COMMIT=$(git rev-parse --short HEAD)
          
          mkdir -p dist
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              if [ "$os" = "windows" ] && [ "$arch" = "arm64" ]; then continue; fi
              
              BINARY_NAME="mwx-isp"
              if [ "$os" = "windows" ]; then
                BINARY_NAME="mwx-isp.exe"
              fi
              
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -ldflags "-s -w \
                -X main.Version=${VERSION} \
                -X main.BuildTime=${BUILD_TIME} \
                -X main.GitCommit=${GIT_COMMIT}" \
                -o "dist/mwx-isp_${os}_${arch}${BINARY_NAME#mwx-isp}"
            done
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: dist/mwx-isp_linux_amd64
          asset_name: mwx-isp_linux_amd64
          asset_content_type: application/octet-stream