name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26'
  NODE_VERSION: '20'
  CGO_ENABLED: 0

jobs:
  # web/static.go does `//go:embed dist/*`, so every Go job needs the built
  # admin UI on disk or it compiles a binary with an empty management console.
  # Build it once and hand the directory to the other jobs as an artifact.
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        working-directory: ./web
        run: |
          npm ci
          npm run build

      - name: Verify the embed source is populated
        run: test -f web/dist/admin/index.html

      - name: Upload frontend build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: web-dist
          path: web/dist
          retention-days: 1
          include-hidden-files: true

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: frontend
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download frontend build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: web/dist

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Run unit tests
        run: go test -v -short -coverprofile=coverage.out ./...

      - name: Run integration tests
        env:
          TEST_DATABASE_HOST: 127.0.0.1
          TEST_DATABASE_PORT: '15432'
          TEST_DATABASE_USER: mwxisp_test
          TEST_DATABASE_PASSWORD: test-only-password
          TEST_DATABASE_NAME: postgres
          TEST_LDAP_URL: ldap://127.0.0.1:1389
          TEST_LDAP_BASE_DN: dc=example,dc=org
          TEST_LDAP_USER_FILTER: (cn=%s)
          TEST_LDAP_BIND_DN_TEMPLATE: cn=%s,ou=users,dc=example,dc=org
          TEST_LDAP_ADMIN_DN: cn=admin,dc=example,dc=org
          TEST_LDAP_ADMIN_PASSWORD: adminpassword
          TEST_LDAP_USER: alice
          TEST_LDAP_PASSWORD: alice-password
          INTEGRATION_REQUIRED: '1'
        run: |
          docker run -d --name postgres -e POSTGRES_USER=mwxisp_test -e POSTGRES_PASSWORD=test-only-password -e POSTGRES_DB=postgres -p 15432:5432 postgres:16-alpine
          docker run -d --name openldap -e LDAP_ROOT=dc=example,dc=org -e LDAP_ADMIN_USERNAME=admin -e LDAP_ADMIN_PASSWORD=adminpassword -e LDAP_USERS=alice,bob -e LDAP_PASSWORDS=alice-password,bob-password -p 1389:1389 bitnamilegacy/openldap:2.6
          go test -tags=integration -count=1 -v ./test/integration/...

      - name: Run linter
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2
          args: --timeout=5m

      - name: Run security scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
        continue-on-error: true

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.out
          fail_ci_if_error: false
        continue-on-error: true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [frontend, test]
    timeout-minutes: 45
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download frontend build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: web/dist

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          BINARY_NAME="mwx-isp"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME="mwx-isp.exe"
          fi

          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "develop")
          BUILD_TIME=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          GIT_COMMIT=$(git rev-parse --short HEAD)

          go build -ldflags "-s -w \
            -X main.Version=${VERSION} \
            -X main.BuildTime=${BUILD_TIME} \
            -X main.GitCommit=${GIT_COMMIT}" \
            -o "dist/${BINARY_NAME}" main.go

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mwx-isp-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          retention-days: 7
